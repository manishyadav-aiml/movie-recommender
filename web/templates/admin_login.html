{% extends "base.html" %}
{% block title %}Admin sign in · MovieMatch{% endblock %}
{% block body %}
<main id="main" class="container narrow">
  <h1>Admin sign in</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin_login') }}" class="card form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password">
      <button type="button" id="toggle-password" class="btn ghost" aria-controls="password" aria-pressed="false">Show</button>
    </div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p><a href="/">← Back to site</a></p>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>{% endblock %}
